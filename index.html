<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>asobi</title>
<link rel="icon" href="loop/icon-192.png">
<style>
:root{--bg:#f1efff;--card:#fff;--ink:#1a1630;--muted:#5d5878;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141220;--card:#1e1b2e;--ink:#efecff;--muted:#a6a0c4;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:24px 16px;display:grid;gap:14px}
h1{margin:0 0 4px;font-size:24px}
a.card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;color:inherit;text-decoration:none;box-shadow:0 4px 0 var(--ink)}
a.card img{width:64px;height:64px;border-radius:14px}
a.card b{display:block;font-size:18px}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>asobi</h1>
  <a class="card" href="yomiage/"><img src="yomiage/icon-192.png" alt=""><div><b>悪ノリ読み上げ</b><span>声をいじって喋らせるボタン集</span></div></a>
  <a class="card" href="loop/"><img src="loop/icon-192.png" alt=""><div><b>クセループ</b><span>ドラムと自分の声でループを作る</span></div></a>
  <a class="card" href="idou/"><img src="idou/icon-192.png" alt=""><div><b>移動時間マップ</b><span>車と電車、日本中どこまで何時間？</span></div></a>
</main>
</body>
</html>
